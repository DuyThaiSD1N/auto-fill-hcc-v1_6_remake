# Web Agent tự sửa trên server trolyhoso. Chạy bằng setup.sh, hoặc:
#   docker compose -f auto-test-hcc/deploy/compose.server.yml up -d --build
#
# Gồm 3 service, KHÔNG đụng stack production (thư mục production, mạng autofill_hcc_net, volume autofill_hcc_mongo_data):
#   test-fe       web 12008, mạng host: nginx gọi được dịch vụ agent (127.0.0.1:12009) chỉ nghe loopback. /auth/ đi tới
#                 backend production để đăng nhập super_admin. Monitor production (nhóm menu Auto test) cũng gọi dịch vụ agent
#                 qua cổng này: AGENT_URL=http://host.docker.internal:12008 trong .env production (HUONG-DAN-SERVER.md mục B).
#   autotest-app  backend THỬ, chạy code agent đang sửa (khu làm việc: clone 3 repo thật ở tag release), chỉ nghe
#                 127.0.0.1:12015. Dịch vụ agent build lại service này sau khi người duyệt đồng ý. Image tag riêng (autotest)
#                 để không đè image production. KHÔNG đặt tên `app`: trùng tên service của stack production.
#   be-mongo      Mongo riêng của backend thử, không auth, chỉ nghe 127.0.0.1:12014. Tài khoản test tạo bằng seed_user.
#
# Biến ${...} đọc từ deploy/.env (setup.sh ghi): AUTH_BACKEND_URL, TEST_JWT_ACCESS_SECRET, TEST_JWT_REFRESH_SECRET, và 3 đường
# dẫn AUTOTEST_BE_DIR / AUTOTEST_MAIN_ENV / AUTOTEST_DATA_DIR cho lần build đầu; dịch vụ agent truyền lại 3 biến này mỗi lần
# build (cây backend trong khu làm việc).
name: auto-test-hcc-server

services:
  test-fe:
    build: ../web
    image: auto-test-hcc-web:latest
    network_mode: host
    environment:
      - BACKEND_URL=${AUTH_BACKEND_URL:-http://127.0.0.1:12005}
      - AGENT_URL=http://127.0.0.1:12009
    restart: unless-stopped

  be-mongo:
    image: mongo:7
    volumes:
      - be_mongo:/data/db
    ports:
      - "127.0.0.1:12014:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  autotest-app:
    build: ${AUTOTEST_BE_DIR:?thiếu đường dẫn backend cần build (setup.sh ghi vào deploy/.env, dịch vụ agent truyền khi build)}
    image: autofill-hcc-be:autotest
    # Bản chép .env production (OCR, LLM...). Các dòng environment dưới đây ghi đè để bản thử không ghi vào production.
    env_file: ${AUTOTEST_MAIN_ENV:?thiếu .env cho backend thử (setup.sh chép từ production)}
    environment:
      - MONGO_URI=mongodb://be-mongo:27017
      - MONGO_HOST=be-mongo
      - MONGO_PORT=27017
      - PORT=12015
      - WEB_CONCURRENCY=2
      # Secret riêng: token của backend thử không dùng được trên production và ngược lại.
      - JWT_ACCESS_SECRET=${TEST_JWT_ACCESS_SECRET:?chạy setup.sh để sinh secret riêng cho backend thử}
      - JWT_REFRESH_SECRET=${TEST_JWT_REFRESH_SECRET:?chạy setup.sh để sinh secret riêng cho backend thử}
      # Không đẩy form snapshot của lượt thử sang vault production.
      - VAULT_URL=
      - VAULT_TOKEN=
      # Extension của bot nạp dạng unpacked, id khác bản cài trên Chrome store.
      - ALLOWED_EXTENSION_IDS=
      # Lớp thanh tra (điền đợt 2) bật cho mọi tài khoản thử; lần chạy lại chỉ khai fillSupports khi lượt gốc có thanh tra
      # (replay.second_pass_options). Hạn chờ rộng hơn production để máy chậm không cắt ngang lượt soát.
      - SECOND_PASS_ENABLED=true
      - SECOND_PASS_USERNAMES=
      - SECOND_PASS_TIMEOUT_SECONDS=60
      - SECOND_PASS_MAX_RUNNING=10
    ports:
      - "127.0.0.1:12015:12015"
    volumes:
      - ${AUTOTEST_DATA_DIR:?thiếu thư mục dữ liệu riêng của backend thử}:/app/data
    depends_on:
      be-mongo:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  be_mongo:
    name: auto_test_hcc_be_mongo
