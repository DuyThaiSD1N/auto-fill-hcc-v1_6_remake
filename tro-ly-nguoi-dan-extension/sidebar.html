<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trợ lý người dân</title>
  <link rel="stylesheet" href="sidebar.css" />
</head>
<body>
  <!-- Khung tổng: KHÔNG đặt class "bot" — trùng với .msg.bot của bubble (msg bot),
       selector .bot sẽ ép height 100dvh lên mọi bubble. -->
  <div class="tlnd-app">
    <!-- Header: avatar + tên + tài khoản/thu gọn/đóng; thanh dưới dành cho voice/chat. -->
    <header class="bot-h">
      <div class="bot-h-top">
        <div class="ava" id="bot-avatar"></div>
        <div class="ht">
          <div class="t">Trợ lý người dân</div>
          <div class="s">Hỗ trợ thủ tục hành chính công</div>
        </div>
        <div class="sp">
          <button id="acc-btn" class="ib" type="button" title="Xem thông tin tài khoản" hidden>👤</button>
          <button id="min-btn" class="ib" type="button" title="Thu gọn">–</button>
          <button id="close-btn" class="ib" type="button" title="Đóng (KHÔNG xóa phiên — mở lại vẫn tiếp tục)">✕</button>
        </div>
      </div>
      <!-- Thanh hành động: nút CÓ CHỮ để người dân biết ngay (không cần rê chuột) -->
      <div class="tbar">
        <button id="handsfree-btn" class="tb" type="button"
                title="Chế độ rảnh tay: em tự đọc và tự nghe">
          <span class="tbi">🎙️</span><span class="tbl">Rảnh tay</span>
        </button>
        <button id="tts-btn" class="tb" type="button" title="Bật/tắt đọc âm thanh">
          <span class="tbi">🔊</span><span class="tbl">Âm thanh</span>
        </button>
        <button id="reset-btn" class="tb" type="button" title="Xóa phiên hiện tại, bắt đầu lại từ đầu">
          <span class="tbi">🔄</span><span class="tbl">Trò chuyện mới</span>
        </button>
      </div>
    </header>

    <!-- Thanh tiến độ toàn trình: chạy theo progress.step/total BE trả -->
    <div class="step-meter" aria-hidden="true"><i id="step-meter-bar"></i></div>

    <!-- Popover tài khoản (nút 👤): tên + nơi gắn acc + đăng xuất -->
    <div class="acc-pop" id="acc-pop" hidden>
      <div class="acc-name" id="acc-name"></div>
      <div class="acc-sub" id="acc-sub"></div>
      <button id="logout-btn" type="button">Đăng xuất</button>
    </div>

    <!-- Thân chat: tin nhắn / chip / card -->
    <main class="bot-b" id="messages"></main>

    <!-- Trạng thái nhỏ (lỗi mạng, đang kết nối...) -->
    <div class="bot-status" id="status" hidden></div>

    <!-- Footer: camera + mic + ô nhập + gửi -->
    <footer class="bot-f">
      <button id="doc-btn" class="fi" type="button" title="Gửi ảnh giấy tờ (Bước 5)">📷</button>
      <button id="mic-btn" class="fi" type="button" title="Nhấn để nói (Bước 4)">🎤</button>
      <form id="chat-form" class="inp-wrap">
        <input id="chat-input" type="text" autocomplete="off"
               placeholder="Bà con gõ hoặc nói câu hỏi…" />
      </form>
      <input id="file-input" type="file"
        accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx" multiple hidden />
      <button id="send-btn" class="send" type="button" title="Gửi">➤</button>
    </footer>
  </div>

  <!-- Màn đăng nhập (bắt buộc): che toàn khung khi chưa có token. Phiên chat phía sau
       GIỮ NGUYÊN — token hết hạn giữa chừng chỉ cần đăng nhập lại là làm tiếp. -->
  <div class="login-scrim" id="login-scrim" hidden>
    <!-- Header đăng nhập chỉ có thu gọn/đóng — màn login che header chính nên không có 2 nút này. -->
    <div class="login-top">
      <button id="login-min-btn" class="ib" type="button" title="Thu gọn">–</button>
      <button id="login-close-btn" class="ib" type="button" title="Đóng (KHÔNG xóa phiên — mở lại vẫn tiếp tục)">✕</button>
    </div>
    <form class="login-card" id="login-form">
      <div class="login-ava" id="login-avatar"></div>
      <h2>Đăng nhập</h2>
      <p class="login-sub">Tài khoản quầy do quản trị viên cấp</p>
      <input id="login-user" type="text" placeholder="Tên đăng nhập"
             autocomplete="username" autocapitalize="off" spellcheck="false" />
      <input id="login-pass" type="password" placeholder="Mật khẩu" autocomplete="current-password" />
      <div class="login-err" id="login-err" hidden></div>
      <button type="submit" id="login-btn" class="login-submit">Đăng nhập</button>
    </form>
  </div>

  <script src="vendor/pdf-lib.min.js"></script>
  <script src="lib/imageToPdf.js"></script>
  <script src="services/render.js"></script>
  <script src="services/tts.js"></script>
  <script src="api/config.js"></script>
  <script src="api/auth.js"></script>
  <script src="api/client.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
