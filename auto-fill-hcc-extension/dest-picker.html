<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <style>
    html, body { background: #fff; }
    body.embedded { padding: 0; }
    #dau {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 4px 5px 10px; background: #1565c0; color: #fff;
    }
    #tieuDe { flex: 1 1 auto; font-size: 13px; font-weight: 600; }
    #dong {
      flex: 0 0 auto; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 4px;
      background: transparent; color: #fff; font-size: 15px; line-height: 1;
    }
    #dong:hover { background: rgba(255, 255, 255, .22); }
    #than { padding: 10px; }
    /* Khung này cao theo nội dung (content.js đo body) -> dropdown phải NẰM TRONG luồng để đẩy chiều
       cao lên, không nổi absolute như trong panel (nổi thì bị cắt ở đáy iframe). */
    .combo-dropdown { position: static; margin-top: 4px; box-shadow: none; }
    #huy {
      margin-top: 6px; padding: 6px 7px; background: #fff; border: 1px solid #ccc; color: #444; font-size: 13px;
    }
    #huy:hover { background: #f2f4f7; border-color: #999; color: #1a1a1a; }
  </style>
</head>

<body class="embedded">
  <!-- Khung "Chuyển thủ tục khác": content.js nhúng BÊN CẠNH panel. Chỉ là lớp nhìn — dữ liệu và
       mọi xử lý (lưu địa chỉ, lên đạn chọn cơ quan, mở trang) vẫn nằm ở popup.js; hai bên nói chuyện
       qua BroadcastChannel có tên riêng truyền trong #hash. -->
  <div id="dau">
    <span id="tieuDe">Chuyển thủ tục khác</span>
    <button id="dong" type="button" title="Đóng (Esc)" aria-label="Đóng">✕</button>
  </div>
  <div id="than">
    <label>Tỉnh/Thành phố</label>
    <div id="comboProvince"></div>
    <label>Phường/Xã</label>
    <div id="comboWard"></div>
    <p id="locationStatus" class="status"></p>
    <label>Thủ tục</label>
    <div id="comboProcedure"></div>
    <p id="keKhaiStatus" class="status"></p>
    <button id="di" type="button" class="secondary-btn">🧭 Mở trang thủ tục</button>
    <button id="huy" type="button">Huỷ</button>
  </div>
  <script src="dest-picker.js"></script>
</body>

</html>
