<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f4f6f9; font-family: system-ui, "Segoe UI", sans-serif; }
    #khung { position: absolute; inset: 0; display: flex; flex-direction: column; }
    #dau {
      flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
      padding: 5px 6px 5px 12px; background: #0e7a6b; color: #fff;
    }
    #bieuTuong { flex: 0 0 auto; font-size: 15px; }
    #tieuDe {
      flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 650;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #dem { flex: 0 0 auto; font-size: 12px; font-weight: 700; opacity: .92; white-space: nowrap; }
    #goiY { flex: 0 0 auto; font-size: 11px; opacity: .85; white-space: nowrap; }
    .nut {
      flex: 0 0 auto; width: 30px; height: 30px; border: 0; border-radius: 7px;
      background: transparent; color: #fff; font-size: 15px; line-height: 1; cursor: pointer;
    }
    .nut:hover:not(:disabled) { background: rgba(255, 255, 255, .2); }
    .nut:disabled { opacity: .35; cursor: default; }
    /* Nút chuyển tệp ghi CHỮ rõ ràng (yêu cầu 2026-09-13) — chỉ mũi tên thì cán bộ phải đoán. */
    .nut.nut-chu {
      width: auto; padding: 0 10px; font-size: 12px; font-weight: 700; white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, .45);
    }
    #dai {
      flex: 0 0 auto; display: flex; gap: 6px; padding: 6px 10px; overflow-x: auto;
      background: #e8f4f0; border-bottom: 1px solid #cde4dc;
    }
    #dai button {
      flex: 0 0 auto; max-width: 200px; padding: 4px 10px;
      border: 1px solid #b7d9ce; border-radius: 999px; background: #fff; color: #134e44;
      font-size: 11.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer;
    }
    #dai button[aria-current="true"] { background: #0e7a6b; border-color: #0e7a6b; color: #fff; }
    #noiDung { flex: 1 1 auto; min-height: 0; position: relative; }
    #noiDung iframe, #noiDung img {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #f4f6f9;
    }
    #noiDung img { object-fit: contain; }
    #bao {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 16px; text-align: center; font-size: 13px; color: #5b7089;
    }
  </style>
</head>

<body>
  <!-- Xem trước giấy tờ của Trợ lý người dân. content.js nhúng trang này làm iframe TRÊN TRANG GỐC:
       khung Trợ lý chỉ rộng 400px, không đọc nổi một tờ A4. Nhúng trang của extension (thay vì nhét
       blob PDF thẳng vào trang cổng) để không phụ thuộc CSP của từng cổng — cùng lý do với autofill.
       Một doc-row có thể gồm NHIỀU tệp: dải tên tệp + ◀ ▶ chỉ hiện khi có từ 2 tệp. -->
  <div id="khung">
    <div id="dau">
      <span id="bieuTuong" aria-hidden="true">📄</span>
      <span id="tieuDe"></span>
      <span id="dem" hidden></span>
      <!-- Đang ghim: "📌 đang giữ". Xem tạm lúc rê chuột: gợi ý nhấn để giữ khung lại. -->
      <span id="goiY"></span>
      <button id="truoc" class="nut nut-chu" type="button" title="File trước (phím ←)" hidden>◀ File trước</button>
      <button id="sau" class="nut nut-chu" type="button" title="File tiếp theo (phím →)" hidden>File tiếp theo ▶</button>
      <button id="dong" class="nut" type="button" title="Đóng (Esc)" aria-label="Đóng xem trước">✕</button>
    </div>
    <div id="dai" role="tablist" aria-label="Các tệp trong mục này" hidden></div>
    <div id="noiDung">
      <div id="bao">Đang mở…</div>
    </div>
  </div>
  <script src="preview.js"></script>
</body>

</html>
