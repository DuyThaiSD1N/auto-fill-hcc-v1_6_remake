<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f4f6f9; font-family: system-ui, "Segoe UI", sans-serif; }
    #khung { position: absolute; inset: 0; display: flex; flex-direction: column; }
    #dau {
      flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
      padding: 3px 4px 3px 10px; background: #1565c0; color: #fff;
    }
    #ten {
      flex: 1 1 auto; min-width: 0;
      font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #goiY { flex: 0 0 auto; font-size: 11px; opacity: .8; white-space: nowrap; }
    #dong {
      flex: 0 0 auto; width: 26px; height: 26px; border: 0; border-radius: 4px;
      background: transparent; color: #fff; font-size: 15px; line-height: 1; cursor: pointer;
    }
    #dong:hover { background: rgba(255, 255, 255, .22); }
    #noiDung { flex: 1 1 auto; min-height: 0; position: relative; }
    #noiDung iframe, #noiDung img {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #f4f6f9;
    }
    #noiDung img { object-fit: contain; }
    #bao {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 16px; text-align: center; font-size: 12.5px; color: #5b7089;
    }
  </style>
</head>

<body>
  <!-- Trang xem trước giấy tờ. Được content.js nhúng làm iframe TRÊN TRANG GỐC vì panel
       extension chỉ rộng 360px, không xem nổi một tờ A4.
       Nhúng trang của extension (thay vì nhét thẳng blob PDF vào trang gốc) là cố ý: cách này
       đã được chứng minh chạy được trên cả 21 cổng dịch vụ công — chính panel hiện tại cũng là
       một iframe chrome-extension:// như vậy. Nhét blob thẳng vào trang gốc thì phụ thuộc
       frame-src/object-src trong CSP của từng cổng, cổng nào siết là hỏng im lặng. -->
  <div id="khung">
    <div id="dau">
      <span id="ten"></span>
      <!-- Đang ghim: 📌. Chưa ghim (chỉ rê chuột): gợi ý cách giữ khung lại. -->
      <span id="goiY">nhấn vào dòng để giữ</span>
      <button id="dong" type="button" title="Đóng xem trước (Esc)" aria-label="Đóng xem trước">✕</button>
    </div>
    <div id="noiDung">
      <div id="bao">Đang mở…</div>
    </div>
  </div>
  <script src="preview.js"></script>
</body>

</html>
