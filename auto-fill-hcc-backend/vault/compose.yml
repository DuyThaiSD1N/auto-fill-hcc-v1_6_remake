services:
  vault:
    build: .
    image: hcc-vault:latest
    env_file: .env
    environment:
      - VAULT_DIR=/vault
    ports:
      - "${VAULT_BIND:?}:${VAULT_PORT:-12100}:8000"
    volumes:
      - ${VAULT_DATA:-./data}:/vault
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
