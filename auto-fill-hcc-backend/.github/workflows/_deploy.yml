name: _deploy (dùng chung)

# Deploy một tag đã build sẵn trên GHCR lên prod. Không chạy trực tiếp: release.yml gọi sau khi
# build, deploy.yml gọi khi bấm Run workflow (quay về / deploy lại tag cũ).
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  check:
    name: Kiểm tag + image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - name: Tag đúng mẫu vYYYY.MM.DD[.n]
        env:
          TAG: ${{ inputs.tag }}
        run: |
          re='^v20[0-9]{2}\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])(\.[1-9][0-9]{0,2})?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "::error::'$TAG' không phải tag phát hành. Bấm Run workflow thì ô 'Use workflow from' phải chọn tab Tags → một tag vYYYY.MM.DD."
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Server chỉ kéo image về; tag chưa build (release lỗi giữa chừng) thì dừng ở đây, không đụng prod.
      - name: Đủ 3 image trên GHCR
        env:
          TAG: ${{ inputs.tag }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          for img in autofill-hcc-be autofill-hcc-fe autofill-hcc-monitor-fe; do
            docker manifest inspect "$REGISTRY/$img:$TAG" >/dev/null \
              || { echo "::error::Chưa có $REGISTRY/$img:$TAG — chạy lại workflow Release của tag này trước."; exit 1; }
          done

  deploy:
    name: Deploy ${{ inputs.tag }} lên prod
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secret deploy chỉ nằm trong Environment này; Environment chỉ cho ref là tag v*.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Đủ cấu hình Environment production
        env:
          HAS_NB: ${{ secrets.NETBIRD_SETUP_KEY != '' }}
          HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS != '' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          missing=()
          [[ "$HAS_NB" == "true" ]] || missing+=("secret NETBIRD_SETUP_KEY")
          [[ "$HAS_KEY" == "true" ]] || missing+=("secret DEPLOY_SSH_KEY")
          [[ "$HAS_KNOWN" == "true" ]] || missing+=("secret DEPLOY_KNOWN_HOSTS")
          [[ -n "$DEPLOY_USER" ]] || missing+=("variable DEPLOY_USER")
          [[ -n "$DEPLOY_HOST" ]] || missing+=("variable DEPLOY_HOST")
          if ((${#missing[@]})); then
            echo "::error::Environment production thiếu: ${missing[*]} (Settings → Environments → production)."
            exit 1
          fi

      # Server nằm trong mạng NetBird: runner tham gia tạm bằng setup key EPHEMERAL (peer tự bị xoá
      # khi offline), xong job máy runner bị huỷ là rời mạng. NETBIRD_MANAGEMENT_URL chỉ cần khi
      # NetBird tự host; trống = NetBird cloud.
      - name: Vào mạng NetBird
        env:
          NB_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
          NB_MGMT_URL: ${{ vars.NETBIRD_MANAGEMENT_URL }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          NB_HOSTNAME: github-deploy-${{ github.run_id }}
        run: |
          curl -fsSL https://pkgs.netbird.io/install.sh | SKIP_UI_APP=true sh
          args=(--setup-key "$NB_SETUP_KEY" --hostname "$NB_HOSTNAME")
          [[ -n "$NB_MGMT_URL" ]] && args+=(--management-url "$NB_MGMT_URL")
          sudo netbird up "${args[@]}"
          # Peer P2P cần vài giây để thông; chờ cổng 22 mở thay vì để ssh fail ngay.
          for i in $(seq 1 30); do
            timeout 3 bash -c "</dev/tcp/$DEPLOY_HOST/22" 2>/dev/null && { echo "Thông $DEPLOY_HOST:22 sau ${i} lần thử"; exit 0; }
            sleep 2
          done
          sudo netbird status -d || true
          echo "::error::Runner đã vào NetBird nhưng không tới được $DEPLOY_HOST:22 — kiểm Access Control (policy cho nhóm của setup key → server, cổng 22)."
          exit 1

      # Khoá deploy bị ép chạy đúng server_deploy.sh (authorized_keys) → chỉ truyền được tag.
      # known_hosts cố định: không tự tin máy lạ.
      - name: SSH → server_deploy.sh ${{ inputs.tag }}
        env:
          TAG: ${{ inputs.tag }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=30 -o ServerAliveInterval=15 \
              "$DEPLOY_TARGET" "$TAG"

      - name: Tóm tắt
        if: always()
        env:
          TAG: ${{ inputs.tag }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "### Deploy \`$TAG\` → prod: $RESULT"
            echo ""
            echo "- Lỗi /healthz thì server đã tự quay về bản chạy trước (xem log bước SSH)."
            echo "- Quay về bản cũ: Actions → **Deploy (chọn tag)** → Run workflow → Tags → tag cũ."
          } >> "$GITHUB_STEP_SUMMARY"
